[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-hookup-planner"
version = "0.1.0"
description = "Semiconductor fab tool hookup planning on an illustrative IFC sub-fab model: capacity check, POC assignment, A* routing, clash detection, hookup list, cost and schedule."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell==0.8.5",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
hookup-planner = "hookup_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hookup_planner = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib._fontconfig_pattern",
    "ignore::DeprecationWarning:matplotlib._mathtext",
]
